# Nascraft (Ports edition) config.yml - ${project.version}
#
# Trading happens at PORTS: local markets placed on the map (defined in ports.yml).
# Each port has its own goods, prices, stock and restock schedule, so hauling
# goods between ports is profitable. Players must be inside a port's radius
# to trade there.

# Language file to use. Available: en_US es_ES it_IT de_DE pt_BR ru_RU zh_CN
language: 'en_US'

database:
  # How many days should logs of trades last in the database?
  # Use -1 to disable (keep all trades logged).
  days-until-history-removed: 60

# Money is handled through Vault.
currency:
  format: "<gradient:#f09947:#feed81>[AMOUNT]$</gradient>"
  not-enough: "<gradient:#FB6363:#C4B3FD>✘ You don't have enough money to buy that!</gradient>"
  decimal-positions: 2
  top-limit: 9999999
  low-limit: 0.005

price-options:
  # With noise enabled, prices drift over time in a pseudo-random manner.
  noise:
    enabled: true
    default-intensity: 1
    intensity-multiplier: 1
    # Time in seconds between noise applications.
    time: 60
  # The default elasticity applies to all goods unless overridden in items.yml or ports.yml.
  default-elasticity: 1
  elasticity-multiplier: 1

market-control:
  # If the market is closed players won't be able to buy/sell anywhere.
  closed: false

  # Starting stock for goods that don't define one (items.yml / ports.yml override this).
  default-starting-stock: 100

  # Default taxation, overridable per item (items.yml) and per port good (ports.yml).
  taxation:
    sell: 0.06
    buy: 0.04
    take-into-account-taxes: false

  # Do players need the permission "nascraft.market" to trade?
  market-permission: true

ports:
  announce-restock:
    enabled: true
    # true: announce restocks to the whole server.
    # false: only players inside the port hear about it.
    global: false

commands:
  nascraft:
    enabled: true
    alias: 'nas'
  market:
    enabled: true
    alias: 'port'
  link:
    enabled: true
    alias: 'nlink'
  discord:
    enabled: true
    alias: 'dis'
  sellall:
    enabled: true
    alias: 'nsellall'
  sellhand:
    enabled: true
    alias: 'nsellhand'
  sell-menu:
    enabled: true
    alias: 'sell'
    size: 45
    help:
      enabled: true
      slot: 4
      texture: 'bc8ea1f51f253ff5142ca11ae45193a4ad8c3ab5e9c6eec8ba7a4fcb7bac40'
    filler:
      material: 'black_stained_glass_pane'
    sell-button:
      slot: 40
      material: 'yellow_stained_glass_pane'
    close-button:
      enabled: true
      slot: 8
      material: 'red_stained_glass_pane'

discord-bot:
  enabled: false
  token: 'TOKEN-ID'
  # Role required to execute admin commands through discord.
  admin-role-id: 'ADMIN-ROLE-ID'
  # Available methods: NATIVE, DISCORDSRV
  link-method: 'NATIVE'
  # Channel to log every trade, with the port where it happened.
  log-trades:
    enabled: false
    channel: 'LOGS-TEXTCHANNEL-ID'

# Experimental: NBT keys to ignore when matching items.
ignored-keys:
  #- "Day"
